[package]
name = "herdr-devserver-status"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Detects dev servers in Herdr panes via pluggable specs and reports lifecycle status."
repository = "https://github.com/Razz21/herdr-devserver-status"
readme = "README.md"
keywords = ["herdr", "devserver", "plugin", "cli", "daemon"]
categories = ["command-line-utilities", "development-tools"]

[lints.clippy]
all = "deny"

[[bin]]
name = "herdr-devserver-status"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
regex = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
libc = "0.2"
sha2 = "0.10"
dotenvy = "0.15.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true